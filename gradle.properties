# Every property used in templates must also be listed in buildSrc/src/main/groovy/blitzlink-common.gradle (expandProps).
org.gradle.jvmargs=-Xmx3G -Xms1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Project
mod_version=26.3.0
mod_group_id=com.hyproj.blitzlink
